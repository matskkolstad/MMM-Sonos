name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Node lines as MagicMirror² supports (>=22.21.1 <23 || >=24)
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (MagicMirror² + Sonos simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Installs MagicMirror² (server only) and playwright-core into .e2e/, then runs
      # the module against the simulated speakers in the runner's preinstalled Chrome.
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/e2e/output/
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # Fails only on critical advisories in runtime dependencies. Lower severities are
      # printed for visibility; some (e.g. `ip` via `sonos`) have no upstream fix yet.
      - run: npm audit --omit=dev --audit-level=critical
